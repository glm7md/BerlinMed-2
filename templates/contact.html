<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | BerlinMed</title>

    <link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <h2>BerlinMed</h2>
            </div>

            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/products" class="active">Products</a></li>
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/contact">Contact Us</a></li>
                </ul>
            </nav>

            <div class="icons">
                <a href="/cart" title="Shopping Cart">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
                <a href="/login" title="Login">
                    <i class="fa-solid fa-user"></i>
                </a>
            </div>

            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <section class="page-header">

        <div class="overlay"></div>

        <div class="page-title">

            <h1>Contact Us</h1>

            <p>We're ready to serve you</p>

        </div>

    </section>

    <section class="contact-section">

        <div class="container contact-grid">

            <div class="contact-info">

                <h2>Contact Details</h2>

                <div class="contact-item">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h3>Phone</h3>
                        <p>+20 106 659 295</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-brands fa-whatsapp"></i>
                    <div>
                        <h3>WhatsApp</h3>
                        <p>Request a quotation now</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h3>Email</h3>
                        <p>info@BerlinMed.com</p>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h3>Address</h3>
                        <p>Cairo - Egypt</p>
                    </div>
                </div>

            </div>

            <div class="contact-form">

                <h2>Send a Message</h2>

                <form onsubmit="return sendMessage(event)">
                    <input type="text" placeholder="Your Name" id="contact-name" required>
                    <input type="email" placeholder="Your Email" id="contact-email" required>
                    <input type="text" placeholder="Phone Number" id="contact-phone">
                    <textarea placeholder="Write your message" id="contact-message" required></textarea>
                    <button type="submit">Send</button>
                </form>

            </div>

        </div>

    </section>

    <section class="map">
        <iframe
            src="https://maps.google.com/maps?q=cairo&t=&z=13&ie=UTF8&iwloc=&output=embed"
            loading="lazy">
        </iframe>
    </section>

    <footer>
        <div class="copyright">
            <p>&copy; 2026 BerlinMed. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        function sendMessage(event) {
            event.preventDefault();
            const name = document.getElementById('contact-name').value;
            const email = document.getElementById('contact-email').value;
            const message = document.getElementById('contact-message').value;

            // In a real app, this would send to the backend
            alert('Thank you ' + name + '! Your message has been received. We will get back to you soon.');
            event.target.reset();
            return false;
        }
    </script>
</body>

</html>

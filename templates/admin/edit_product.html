<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | BerlinMed Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-page {
            min-height: 100vh;
            background-color: #f5f7fa;
        }

        .admin-header {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .admin-header h1 i {
            margin-right: 10px;
        }

        .admin-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .admin-form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .form-header {
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            padding: 25px 30px;
        }

        .form-header h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
        }

        .form-header h2 i {
            margin-right: 10px;
        }

        .form-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #0084d6;
            box-shadow: 0 0 0 3px rgba(0,132,214,0.1);
            outline: none;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            font-family: 'Poppins', sans-serif;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-cancel {
            padding: 14px 28px;
            background: #f8f9fa;
            color: #6c757d;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-cancel:hover {
            background: #e9ecef;
            border-color: #d4d9e2;
            transform: translateY(-2px);
        }

        .btn-submit {
            padding: 14px 28px;
            background: linear-gradient(135deg, #0084d6, #00a651);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,132,214,0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .image-preview {
            margin-top: 15px;
            max-width: 200px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px dashed #eee;
        }

        .image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .image-preview-message {
            text-align: center;
            padding: 30px 20px;
            color: #666;
        }

        .image-preview-message i {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ddd;
        }

        .current-image {
            margin-top: 15px;
            text-align: center;
        }

        .current-image img {
            max-width: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .flash-messages {
            margin-bottom: 25px;
        }

        .flash-message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid;
        }

        .flash-message.success {
            background: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }

        .flash-message.error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }

        @media (max-width: 600px) {
            .admin-container {
                margin: 15px auto;
                padding: 0 15px;
            }

            .form-body {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn-cancel,
            .btn-submit {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="admin-header">
        <div class="container">
            <h1><i class="fas fa-edit"></i> Edit Product</h1>
        </div>
    </header>

    <!-- Flash Messages -->
    <div id="flash-messages" style="max-width: 800px; margin: 20px auto 0; padding: 0 20px; display: none;"></div>

    <!-- Main Content -->
    <section class="admin-page">
        <div class="admin-container">
            <div class="admin-form-card">
                <div class="form-header">
                    <h2><i class="fas fa-box"></i> Edit Product: <span id="product-name-header">Loading...</span></h2>
                </div>

                <div class="form-body">
                    <form onsubmit="return handleEditProduct(event)" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="name">Product Name *</label>
                            <input type="text" id="name" name="name" required placeholder="Enter product name">
                        </div>

                        <div class="form-group">
                            <label for="description">Product Description *</label>
                            <textarea id="description" name="description" required placeholder="Describe the product in detail"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="price">Price (USD) *</label>
                            <input type="number" id="price" name="price" step="0.01" min="0" required placeholder="Enter price in USD">
                        </div>

                        <div class="form-group">
                            <label for="stock">Available Stock *</label>
                            <input type="number" id="stock" name="stock" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="image">Product Image</label>
                            <input type="file" id="image" name="image" accept="image/*">
                            <div class="image-preview" id="imagePreview">
                                <div class="image-preview-message">
                                    <i class="fas fa-image"></i>
                                    <p>No file chosen</p>
                                </div>
                            </div>
                            <div class="current-image" id="current-image-container" style="display: none;">
                                <p>Current Image:</p>
                                <img id="current-image" src="" alt="">
                                <small>Leave blank to keep current image</small>
                            </div>
                            <small>Allowed formats: JPG, PNG, GIF (Max 5MB)</small>
                        </div>

                        <div class="form-actions">
                            <a href="/admin" class="btn-cancel">Cancel</a>
                            <button type="submit" class="btn-submit">
                                <i class="fas fa-save"></i> Update Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="/static/js/api.js"></script>
    <script src="/script.js"></script>
    <script>
        let currentProductId = null;

        // Image preview functionality
        document.getElementById('image').addEventListener('change', function(e) {
            const previewContainer = document.getElementById('imagePreview');
            const file = e.target.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else {
                previewContainer.innerHTML = `
                    <div class="image-preview-message">
                        <i class="fas fa-image"></i>
                        <p>No file chosen</p>
                    </div>
                `;
            }
        });

        function showFlash(message, isError) {
            const el = document.getElementById('flash-messages');
            el.style.display = 'block';
            el.innerHTML = `
                <div style="padding: 15px 20px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid; background: ${isError ? '#f8d7da' : '#d4edda'}; color: ${isError ? '#721c24' : '#155724'}; border-left-color: ${isError ? '#dc3545' : '#28a745'}; font-weight: 500;">
                    <i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${message}
                </div>
            `;
        }

        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            
            if (!id) {
                showFlash('No product ID provided', true);
                return;
            }

            currentProductId = id;
            const { ok, data } = await API.getProduct(id);
            
            if (!ok || !data) {
                showFlash('Product not found', true);
                return;
            }

            document.getElementById('product-name-header').textContent = data.name;
            document.getElementById('name').value = data.name;
            document.getElementById('description').value = data.description;
            document.getElementById('price').value = data.price;
            document.getElementById('stock').value = data.stock;

            if (data.image) {
                const container = document.getElementById('current-image-container');
                const img = document.getElementById('current-image');
                img.src = '/static/images/' + data.image;
                img.alt = data.name;
                container.style.display = 'block';
            }
        }

        async function handleEditProduct(event) {
            event.preventDefault();

            // Check session first
            const sessionRes = await API.checkSession();
            if (!sessionRes.data.admin) {
                window.location.href = '/login';
                return false;
            }

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('stock', document.getElementById('stock').value);

            const fileInput = document.getElementById('image');
            if (fileInput.files.length > 0) {
                formData.append('image', fileInput.files[0]);
            }

            const { ok, data } = await API.editProduct(currentProductId, formData);
            
            if (ok) {
                showFlash('Product updated successfully!');
                setTimeout(() => { window.location.href = '/admin'; }, 1000);
            } else {
                showFlash(data.error || 'Failed to update product', true);
            }
            return false;
        }

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>
</body>

</html>
